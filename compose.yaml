services:

  mongodb:
    image: mongo:8
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      ./backend
    ports:
      - "5002:5002"
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb

  frontend:
    build:
        ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo-data:
